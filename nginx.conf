#   - Por RUTA:      http://localhost/code/        → mira el principio de la URL  (location)
#   - Por SUBDOMINIO: http://code.localhost/       → mira el nombre pedido        (server_name)
#
# Este fichero, tal como viene, publica por ruta:
#   /             → portal: los archivos de proxy/web/
#   /code/        → servicio "code"      (code-server, puerto 8443)
#   /portainer/   → servicio "portainer" (Portainer, puerto 9000)
# Para añadir un servicio, copia uno de los bloques de abajo cambiando la ruta (o el nombre) y el destino.
# Después de cambiar este fichero: docker compose restart proxy

# DNS interno de Docker. Como cada location pone el servicio en una variable ($destino), nginx lo
# busca en cada petición (guardando la respuesta 10 s) en vez de una sola vez al arrancar. Así:
#   - el proxy arranca aunque algún servicio esté parado o mal escrito (esa ruta da 502), y
#   - si un contenedor se recrea (y cambia de IP), el proxy lo encuentra solo.
resolver 127.0.0.11 valid=10s ipv6=off;

# Cabeceras para TODOS los servicios, estén publicados por ruta o por subdominio.
# Están aquí fuera, y no dentro de un server { }, para que las hereden todos los bloques server.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Prefix $prefijo;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
client_max_body_size 50m;           # tamaño máximo de lo que se sube (formularios, ficheros)


# WebSockets: si el navegador pide "Upgrade", se le pasa al servicio (code-server lo necesita)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Web Promocional
server {
    listen 80 default_server;
    server_name www.ondamedia.local ondamedia.local ondamedia.localhost;
    root /usr/share/nginx/html/web;     # el portal: proxy/web/ (montado como volumen)

}

# 2. Intranet Corporativa
server {
    listen 80;
    server_name intranet.ondamedia.local intranet.ondamedia.localhost;
    root /usr/share/nginx/html/intranet;     # el portal: proxy/web/ (montado como volumen)

    set $prefijo "";                # en el portal no hay prefijo


}

#3. 
server {
    listen 80;
    server_name portainer.ondamedia.local portainer.ondamedia.local.localhost;
    set $prefijo "";

    location / {
        set $destino portainer:9000;
        proxy_pass http://$destino;
    }
}

# 4. Visual Studio Code
server {
    listen 80;
    server_name code.ondamedia.local code.ondamedia.localhost;
    set $prefijo "";

    location / {
        set $destino code:8443;
        proxy_pass http://$destino;
    }
}

