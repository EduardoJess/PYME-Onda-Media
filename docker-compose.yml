services:
#PROXY
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # la configuración
      - ./web:/usr/share/nginx/html/web:ro
      - ./intranet:/usr/share/nginx/html/intranet:ro
      - ./certs:/etc/nginx/certs:ro                            # el certificado (Paso 1)

  #visual studio
  code:
    image: lscr.io/linuxserver/code-server:latest
    restart: always
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Madrid
      PASSWORD: "${PASSWORD_CODE_SERVER}"
    volumes:
      - ./intranet:/config/workspace/intranet
      - ./web:/config/workspace/web
      - code_config:/config

      #Duplicati
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - SETTINGS_ENCRYPTION_KEY="${SETTINGS_ENCRYPTION_KEY}"
      - CLI_ARGS= #optional
      - DUPLICATI__WEBSERVICE_PASSWORD="${DUPLICATI__WEBSERVICE_PASSWORD}"
    volumes:
      - ./duplicati:/config
      - .:/source:ro
    restart: unless-stopped


    #POrtainer
  portainer:
    image: portainer/portainer-ce:latest
    restart: always

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  
  # JELLYFIN
  jellyfin:
    image: jellyfin/jellyfin
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=http://jellyfin.ondamedia.local
    volumes:
      - ./jellyfin_config:/config
      - jellyfin_cache:/cache
      - ./media:/media

