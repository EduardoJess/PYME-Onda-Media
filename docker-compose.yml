services:
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # la configuración
      - ./web:/usr/share/nginx/html/web:ro
      - ./intranet:/usr/share/nginx/html/intranet:ro
