     <form action="OndaMedia.php" method="get">
     
        <!-- Formulario de registro -->
        <h2> Registro OndaMedia</h1>
         <fieldset><br>
            <legend><section id="formulario">Formulario</section></legend>

            <header class="main-header">
            <!-- Introducen datos personales -->
            <h3>Datos personales</h3>
             <div>
                <fieldset>
                     <label for="nombre">Nombre:</label>
                     <input type="text" id="nombre" name="nombre" required minlength="3" pattern=".*\S.*" title="El nombre debe tener mínimo 3 caracteres y no puede estar vacío" placeholder="Escribe tu nombre"><br>
                     <label for="apellido">Apellidos:</label>
                     <input type="text" id="apellido" name="apellido" required minlength="3" maxlength="40" pattern=".*\S.*" title="Los apellidos deben tener mínimo 3 caracteres y no pueden estar vacío" placeholder="Escribe tus dos apellidos"><br>
                     <label for="edad">Edad:</label>
                     <input type="number" id="edad" name="edad" required min="16" max="65">
                </fieldset><br>
             </div>

                 <!-- Más datos (teléfono, código postal, email, etc) -->
                 <div>
                  <h3>Otros datos</h3>
                     <fieldset>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required><br>
                        <label for="telefono">Número de teléfono:</label>
                        <input type="number" id="telefono" name="telefono" pattern="[0-9]{9}" maxlength="9" minlength="9"><br>
                        <label for="CodPost">Código Postal:</label>
                        <input type="tel" id="CodPost" name="CodPost" required pattern="[0-9]{5}" maxlength="5" minlength="5" placeholder="12345" title="Debe contener exactamente 5 números"><br>
                        <label for="FechaNaci">Fecha de nacimiento:</label>
                        <input type="date" id="FechaNaci" name="FechaNaci" required>
                     </fieldset>
                 </div>
                   <h3>Tipo de mensaje</h3>
                    <input type="radio" id="duda" name="TipoMensaje" value="duda">
                    <label for="Duda">Duda</label><br>

                    <input type="radio" id="sugerencia" name="TipoMensaje" value="sugerencia">
                    <label for="sugerencia">Sugerencia</label><br>

                    <input type="radio" id="queja" name="TipoMensaje" value="queja">
                    <label for="queja">Queja</label><br>

                    <input type="radio" id="otros" name="TipoMensaje" value="otros">
                    <label for="otros">Otros</label>
            <label for="enviar">ENVIAR FORMULARIO</label>
            <input type="submit" id="enviar" name="enviar">
         </fieldset>
     </form>
     <footer><section id="contacto">OndaMedia@hotmail.es</section></footer>
     </body>
