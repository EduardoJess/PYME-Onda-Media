<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web principal OndaMedia</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- Título e imagen -->
  <header>
    <h1><section id="inicio">Web principal OndaMedia</section></h1>
    <div class="logo">
      <a href="#inicio">
        <img src="imagenes/pagweb1.png" alt="Logotipo de la empresa">
      </a>
    </div> 
    
    <nav class="navigation">
      <ul>
        <li><a href="#inicio">Ir a inicio</a></li>
        <li><a href="#formulario">Ir a formulario</a></li>
        <li><a href="#contacto">Ir a contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form action="OndaMedia.php" method="get">
       <!-- Formulario de registro -->
       <h2>Registro OndaMedia</h2>
        <fieldset><br>
           <legend><section id="formulario">Formulario</section></legend>

           <!-- Introducen datos personales -->
           <h3>Datos personales</h3>
            <div>
               <fieldset>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required minlength="3" pattern=".*\S.*" title="El nombre debe tener mínimo 3 caracteres y no puede estar vacío" placeholder="Escribe tu nombre"><br>
                    <label for="apellido">Apellidos:</label>
                    <input type="text" id="apellido" name="apellido" required minlength="3" maxlength="40" pattern=".*\S.*" title="Los apellidos deben tener mínimo 3 caracteres y no pueden estar vacío" placeholder="Escribe tus dos apellidos"><br>
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" required min="16" max="65">
               </fieldset><br>
            </div>

            <!-- Más datos (teléfono, código postal, email, etc) -->
            <div>
              <h3>Otros datos</h3>
                <fieldset>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required><br>
            <!-- Corrección: type="number" no soporta bien pattern ni minlength/maxlength. Se cambia a type="tel" -->
                    <label for="telefono">Número de teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" placeholder="600123456"><br>

                    <label for="CodPost">Código Postal:</label>
                    <input type="tel" id="CodPost" name="CodPost" required pattern="[0-9]{5}" maxlength="5" minlength="5" placeholder="12345" title="Debe contener exactamente 5 números"><br>

                    <label for="FechaNaci">Fecha de nacimiento:</label>
                    <input type="date" id="FechaNaci" name="FechaNaci" required>
                </fieldset>
            </div>
          
            <!-- Tipo de mensaje (duda, sugerencia, etc) -->
             <h3>Tipo de mensaje</h3>
                    <input type="radio" id="duda" name="TipoMensaje" value="duda">
                    <label for="duda">Duda</label><br>

                    <input type="radio" id="sugerencia" name="TipoMensaje" value="sugerencia">
                    <label for="sugerencia">Sugerencia</label><br>

                    <input type="radio" id="queja" name="TipoMensaje" value="queja">
                    <label for="queja">Queja</label><br>

                    <input type="radio" id="otros" name="TipoMensaje" value="otros">
                    <label for="otros">Otros</label><br>

            <!-- Zona para escribir el mensaje -->
                    <label for="Mensaje"><h3>Mensaje</h3></label><br>
                    <textarea id="Mensaje" name="Mensaje" minlength="10" rows="4" cols="50" placeholder="Escriba aquí su mensaje"></textarea><br>

            <!-- Subida de documentos -->
                    <label for="documentos"><h3>Subida de documentos (puede seleccionar varios):</h3></label>
                    <input type="file" id="documentos" name="documentos[]" accept=".pdf, .doc, .docx, application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple><br>
            <!-- /pdf, /msword, /vnd asegura que el filtro funciona de forma correcta tanto en cualquier navegador como en cualquier SO -->

            <!-- Aceptación de condiciones "protección de datos" -->
                    <input type="checkbox" id="protedatos" name="protedatos" value="ACEPTO_protedatos" required>
                    <label for="protedatos">Acepto las condiciones de Protección de datos </label>
           
            <!-- FIN (ENVIAR) --><br>
                    <label for="enviar">ENVIAR FORMULARIO</label>
                    <input type="submit" id="enviar" name="enviar"><br>
        </fieldset>
    </form>
  </main>

  <footer><section id="contacto">OndaMedia@hotmail.es</section></footer>
</body>
</html>
