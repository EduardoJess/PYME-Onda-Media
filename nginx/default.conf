# 1. Web Promocional
server {
    listen 80;
    server_name www.ondamedia.local ondamedia.local;
    location / {
        root /usr/share/nginx/html/web;
        index index.html;
    }
}

# 2. Intranet Corporativa
server {
    listen 80;
    server_name intranet.ondamedia.local;
    location / {
        root /usr/share/nginx/html/intranet;
        index index.html;
    }
}

# 3. Portainer
server {
    listen 80;
    server_name portainer.ondamedia.local;
    location / {
        proxy_pass http://portainer:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

# 4. VSCode (Code-Server)
server {
    listen 80;
    server_name code.ondamedia.local code-server.ondamedia.local;
    location / {
        proxy_pass http://code-server:8080;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }
}

# 5. Duplicati
server {
    listen 80;
    server_name duplicati.ondamedia.local;
    location / {
        proxy_pass http://duplicati:8200;
        proxy_set_header Host $host;
    }
}

# 6. Uptime Kuma (Servicio Opcional de Monitorización)
server {
    listen 80;
    server_name kuma.ondamedia.local;
    location / {
        proxy_pass http://uptime-kuma:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}